<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thingy Bridge: keyboard webpage</title>
<style>
  /* A page that only listens to ordinary keys, so the Thingy Bridge (a Bluetooth keyboard)
     controls it with no extra code: Left/Right move, Up/Down zoom, Enter opens, Escape closes,
     Play/Pause (or Space) starts and stops the slideshow. */
  :root {
    --bg: #EEF1F3; --ink: #1E2730; --soft: #63717D; --nordic: #00A9CE;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root { --bg: #1B242D; --ink: #E3EAEF; --soft: #93A3AF; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 17px/1.4 "Avenir Next", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .strip { position: absolute; top: 50%; left: 0; display: flex; gap: 4vw; transform: translateY(-50%);
    transition: transform .45s cubic-bezier(.2,.7,.2,1); padding-left: 32vw; }
  .card { flex: none; width: 36vw; aspect-ratio: 4 / 3; border-radius: 18px; display: grid; place-items: center;
    font-size: 9vw; font-weight: 600; color: rgba(255,255,255,.92); opacity: .45; transform: scale(.86);
    transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .45s; }
  .card.now { opacity: 1; transform: scale(var(--zoom, 1)); }
  body.open .card.now { transform: scale(calc(var(--zoom, 1) * 1.9)); }
  body.open .card:not(.now) { opacity: 0; }
  .bar { position: absolute; left: 0; right: 0; bottom: 5vh; display: flex; justify-content: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); opacity: .35; transition: opacity .3s, background .3s; }
  .dot.now { background: var(--nordic); opacity: 1; }
  .last { position: absolute; top: 4vh; left: 0; right: 0; text-align: center; color: var(--soft); min-height: 1.4em; }
  body.playing .last::after { content: " (playing)"; }
  @media (prefers-reduced-motion: reduce) { .strip, .card { transition: none; } }
</style>
</head>
<body>
<div class="last" id="last" aria-live="polite">Tilt the Thingy</div>
<div class="strip" id="strip"></div>
<div class="bar" id="bar"></div>
<script>
const colors = ['#0E94B8', '#E39A2D', '#2E9E6A', '#7B61C9', '#D9534F', '#3D7DD8'];
const strip = document.getElementById('strip'), bar = document.getElementById('bar');
colors.forEach((c, i) => {
  const card = document.createElement('div'); card.className = 'card'; card.style.background = c; card.textContent = i + 1;
  strip.append(card);
  const dot = document.createElement('div'); dot.className = 'dot'; bar.append(dot);
});
let index = 0, zoom = 1, timer = null;

function render() {
  [...strip.children].forEach((c, i) => c.classList.toggle('now', i === index));
  [...bar.children].forEach((d, i) => d.classList.toggle('now', i === index));
  const step = strip.children[0].offsetWidth + window.innerWidth * 0.04;
  strip.style.transform = `translate(${-index * step}px, -50%)`;
  strip.children[index].style.setProperty('--zoom', zoom);
}
function go(delta) { index = (index + delta + colors.length) % colors.length; zoom = 1; render(); }
function togglePlay() {
  if (timer) { clearInterval(timer); timer = null; } else timer = setInterval(() => go(1), 2000);
  document.body.classList.toggle('playing', !!timer);
}

const actions = {
  ArrowRight: () => go(1), ArrowLeft: () => go(-1),
  ArrowUp: () => { zoom = Math.min(1.3, zoom + 0.1); render(); },
  ArrowDown: () => { zoom = Math.max(0.7, zoom - 0.1); render(); },
  Enter: () => document.body.classList.toggle('open'),
  Escape: () => document.body.classList.remove('open'),
  Backspace: () => document.body.classList.remove('open'),
  MediaPlayPause: togglePlay, ' ': togglePlay,
};
const names = { ArrowRight: 'Right', ArrowLeft: 'Left', ArrowUp: 'Up', ArrowDown: 'Down', Enter: 'OK',
                Escape: 'Back', Backspace: 'Back', MediaPlayPause: 'Play/Pause', ' ': 'Play/Pause' };
document.addEventListener('keydown', e => {
  const act = actions[e.key];
  if (!act) return;
  e.preventDefault();
  act();
  document.getElementById('last').textContent = names[e.key];
});
addEventListener('resize', render);
render();
</script>
</body>
</html>
